<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8b0000">
<meta name="monetag" content="74bf7ed90c39789dbe996e28a5bd3b4a">
<title>খবরদেখো | Khobordekho</title>
<link rel="icon" href="/favicon.png"><link rel="apple-touch-icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#8b0000;--red2:#b3121b;--bg:#f3f1ef;--card:#fff;--text:#161616;--mut:#6b6b6b;--line:#e6e2de;--sh:0 4px 18px rgba(60,0,0,.09)}
[data-theme=dark]{--red:#8f0f16;--red2:#e5434b;--bg:#0f0f10;--card:#1a1a1c;--text:#f2f2f2;--mut:#a3a3a8;--line:#2c2c30;--sh:0 4px 18px rgba(0,0,0,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Hind Siliguri',system-ui,sans-serif;line-height:1.6;font-size:16px;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}img{max-width:100%}.wrap{max-width:1220px;margin:auto;padding:0 16px}
.top{background:#5c0000;color:#fff;font-size:13px;padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;gap:8px}
.tools{display:flex;gap:6px}.btn{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.35);padding:3px 12px;border-radius:20px;cursor:pointer;font:inherit;font-size:12.5px;white-space:nowrap}
.btn:hover{background:#fff;color:var(--red)}
.brand{background:var(--card);padding:16px 0 12px;text-align:center;border-bottom:1px solid var(--line)}
.logo{height:62px;width:auto;display:inline-block}[data-theme=dark] .logo{filter:invert(1)}
.tag{font-size:13px;color:var(--mut);margin-top:4px;letter-spacing:.3px}
nav{background:var(--red);position:sticky;top:0;z-index:20;box-shadow:0 3px 10px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top)}
nav .wrap{display:flex;align-items:center}.links{display:flex;overflow-x:auto;scrollbar-width:none;flex:1;scroll-snap-type:x proximity}.links::-webkit-scrollbar{display:none}
.links a{color:#fff;padding:12px 15px;font-weight:600;white-space:nowrap;font-size:16px;position:relative;scroll-snap-align:start;opacity:.92}
.links a:after{content:"";position:absolute;left:15px;right:15px;bottom:6px;height:3px;background:#fff;border-radius:2px;transform:scaleX(0);transition:.25s}
.links a:hover:after,.links a.on:after{transform:scaleX(1)}.links a.on{opacity:1}
.sbtn{background:none;border:0;color:#fff;font-size:19px;cursor:pointer;padding:8px 6px 8px 12px}
.sbar{display:none;background:var(--card);border-bottom:1px solid var(--line);padding:10px 0}.sbar.open{display:block}
.sbar input{width:100%;padding:11px 16px;border:2px solid var(--red);border-radius:30px;font:inherit;background:var(--bg);color:var(--text);outline:0}
.ticker{display:flex;align-items:center;background:var(--card);margin:14px 0;border-radius:8px;overflow:hidden;box-shadow:var(--sh)}
.ticker b{background:var(--red2);color:#fff;padding:8px 16px;white-space:nowrap;font-weight:700;display:flex;gap:7px;align-items:center}
.ticker b:before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:bl 1.2s infinite}@keyframes bl{50%{opacity:.2}}
.ticker div{overflow:hidden;white-space:nowrap;flex:1}.ticker p{display:inline-block;margin:0;padding-left:100%;animation:mq 60s linear infinite;font-size:15px;font-weight:500}.ticker:hover p{animation-play-state:paused}@keyframes mq{to{transform:translateX(-100%)}}
.hero{display:grid;grid-template-columns:1.65fr 1fr;gap:16px;margin-bottom:22px}
.img{aspect-ratio:16/10;background:linear-gradient(135deg,#5c0000,var(--red2));position:relative;overflow:hidden}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}
.noimg:before{content:"";position:absolute;inset:0;background:url(/logo.png) center/55% no-repeat;filter:invert(1);opacity:.18}
a:hover>.img img,a:hover .img img{transform:scale(1.06)}
.hl{border-radius:14px;overflow:hidden;position:relative;display:block;box-shadow:var(--sh);min-height:100%}
.hl .img{aspect-ratio:auto;height:100%;min-height:380px}
.hl .cap{position:absolute;left:0;right:0;bottom:0;padding:60px 22px 20px;background:linear-gradient(transparent,rgba(0,0,0,.88));color:#fff}
.hl h1{font-size:clamp(22px,3.2vw,34px);line-height:1.3;margin:8px 0 6px;font-weight:700}.hl p{margin:0;opacity:.9;font-size:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;background:var(--red2);color:#fff;font-size:12.5px;font-weight:600;padding:1px 11px;border-radius:20px}
.minis{display:flex;flex-direction:column;gap:12px}
.mini{display:flex;gap:12px;background:var(--card);border-radius:12px;padding:10px;box-shadow:var(--sh);transition:.2s;flex:1;align-items:center}.mini:hover{transform:translateX(4px)}
.mini .img{width:112px;min-width:112px;aspect-ratio:4/3;border-radius:8px}.mini h4{margin:0 0 3px;font-size:16px;line-height:1.35;font-weight:600;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{color:var(--mut);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;margin-bottom:20px}
.sec{display:flex;align-items:center;gap:12px;margin:26px 0 14px}.sec:first-child{margin-top:4px}
.sec h2{margin:0;font-size:22px;font-weight:700;border-left:6px solid var(--red2);padding-left:11px;line-height:1.1}.sec:after{content:"";flex:1;height:2px;background:var(--line)}
.sec a{order:3;font-size:14px;color:var(--red2);font-weight:600;white-space:nowrap}.sec:after{order:2}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:.25s;animation:up .5s both}
.card:hover{transform:translateY(-5px);box-shadow:0 12px 28px rgba(139,0,0,.2)}@keyframes up{from{opacity:0;transform:translateY(14px)}}
.card .b{padding:12px 14px 14px}.card h3{font-size:18px;line-height:1.4;margin:8px 0 6px;font-weight:600}.card:hover h3,.mini:hover h4,.li:hover{color:var(--red2)}
.card p{margin:0 0 8px;color:var(--mut);font-size:15px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
aside .box{background:var(--card);border-radius:14px;box-shadow:var(--sh);overflow:hidden;position:sticky;top:64px}
.tabs{display:flex}.tabs button{flex:1;padding:12px;border:0;background:var(--bg);color:var(--text);font:inherit;font-weight:700;cursor:pointer;border-bottom:3px solid transparent}.tabs button.on{background:var(--card);color:var(--red2);border-color:var(--red2)}
.li{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:600;line-height:1.4;align-items:flex-start}
.li:last-child{border:0}.li .n{background:var(--red);color:#fff;min-width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px}.li small{display:block;font-weight:400;color:var(--mut);font-size:12.5px;margin-top:2px}
.art{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:clamp(16px,3vw,30px)}
.art h1{font-size:clamp(26px,4vw,40px);line-height:1.3;margin:12px 0;font-weight:700}.art .img{aspect-ratio:16/9;border-radius:12px;margin:16px 0}
.art .body p{font-size:19px;line-height:1.95;margin:0 0 18px}.art .lede{font-size:20px;color:var(--mut);font-weight:500;border-left:4px solid var(--red2);padding-left:14px;margin:0 0 18px}
.share{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0;align-items:center}.share a,.share button{background:var(--red);color:#fff;border:0;border-radius:20px;padding:6px 16px;font:inherit;font-size:14px;cursor:pointer;font-weight:600}
.back{color:var(--red2);font-weight:600;font-size:14px}
.job{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px;font-weight:600;margin:0 0 6px;color:var(--red2)}.jbox{background:var(--bg);border-left:5px solid var(--red2);border-radius:10px;padding:14px 16px;margin:0 0 20px;display:grid;gap:8px;font-size:17px}.apply{background:var(--red2);color:#fff;padding:10px 24px;border-radius:30px;font-weight:700;justify-self:start}.apply:hover{background:var(--red)}
.empty{padding:50px 20px;text-align:center;color:var(--mut);background:var(--card);border-radius:12px;border:2px dashed var(--line)}
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--card) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px;height:260px;margin-bottom:16px}@keyframes sh{to{background-position:-200% 0}}
footer{background:linear-gradient(160deg,#5c0000,var(--red));color:#fff;margin-top:36px;padding:30px 0 calc(18px + env(safe-area-inset-bottom))}
footer .logo{filter:invert(1);height:54px}.fl{display:flex;flex-wrap:wrap;gap:6px 18px;margin:16px 0;font-weight:500}.fl a{opacity:.9}.fl a:hover{opacity:1;text-decoration:underline}
footer small{opacity:.8;display:block;border-top:1px solid rgba(255,255,255,.2);padding-top:12px}
#up{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:44px;height:44px;border-radius:50%;background:var(--red2);color:#fff;border:0;font-size:20px;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35);display:none;z-index:30}
@media(max-width:960px){.grid{grid-template-columns:1fr}aside .box{position:static}}
@media(max-width:760px){.hero{grid-template-columns:1fr}.hl .img{min-height:260px}.logo{height:46px}.links a{padding:11px 12px;font-size:15px}.cards{grid-template-columns:repeat(2,1fr);gap:12px}.card h3{font-size:16px}.card p{display:none}.mini .img{width:96px;min-width:96px}.ticker b{padding:8px 10px}.art .body p{font-size:18px}}
@media(max-width:420px){.cards{grid-template-columns:1fr}.card{flex-direction:row}.card .img{width:118px;min-width:118px;aspect-ratio:1;border-radius:0}.card .b{padding:9px 11px}.card h3{margin:5px 0 3px}.top .btn{padding:3px 9px}}
</style></head><body>
<div class="top"><div class="wrap"><span id="date"></span><div class="tools"><button class="btn" id="lg"></button><button class="btn" id="th"></button></div></div></div>
<div class="brand"><a href="#/"><img class="logo" src="/logo.png" alt="খবরদেখো"></a><div class="tag" id="tag"></div></div>
<nav><div class="wrap"><div class="links" id="nav"></div><button class="sbtn" id="sb" aria-label="Search">🔍</button></div></nav>
<div class="sbar" id="sbar"><div class="wrap"><input id="q" type="search"></div></div>
<div class="wrap"><div class="ticker"><b id="bk"></b><div><p id="tk"></p></div></div>
<div id="top"></div>
<div class="grid"><main id="main"></main><aside><div class="box"><div class="tabs"><button id="t0"></button><button id="t1"></button></div><div id="side"></div></div></aside></div></div>
<footer><div class="wrap"><img class="logo" src="/logo.png" alt=""><div class="fl" id="fl"></div><small id="cp"></small></div></footer>
<button id="up" aria-label="Top">↑</button>
<script>
const CATS=[["home","প্রচ্ছদ","Home"],["bd","বাংলাদেশ","Bangladesh"],["pol","রাজনীতি","Politics"],["world","আন্তর্জাতিক","International"],["eco","অর্থনীতি","Economy"],["sport","খেলা","Sports"],["ent","বিনোদন","Entertainment"],["tech","প্রযুক্তি","Technology"],["edu","শিক্ষা","Education"],["jobs","চাকরি","Jobs"],["op","মতামত","Opinion"],["life","লাইফস্টাইল","Lifestyle"]];
const S={tag:["সত্য ও নিরপেক্ষ সংবাদের বিশ্বস্ত ঠিকানা","Your trusted source for truthful news"],bk:["শিরোনাম","BREAKING"],t0:["সর্বশেষ","Latest"],t1:["জনপ্রিয়","Popular"],cp:["© খবরদেখো। সর্বস্বত্ব সংরক্ষিত।","© Khobordekho. All rights reserved."],none:["এখনো কোনো খবর পাওয়া যায়নি।","No news found yet."],back:["← প্রচ্ছদে ফিরুন","← Back to home"],all:["সব দেখুন →","View all →"],share:["শেয়ার করুন:","Share:"],copy:["লিংক কপি","Copy link"],copied:["কপি হয়েছে ✓","Copied ✓"],rel:["আরও পড়ুন","Related news"],sr:["অনুসন্ধান: ","Search: "],ph:["খবর খুঁজুন...","Search news..."],views:["বার পড়া হয়েছে","views"],org:["প্রতিষ্ঠান","Organization"],dead:["আবেদনের শেষ তারিখ","Deadline"],apply:["আবেদন করুন","Apply now"],exp:["মেয়াদ শেষ","Expired"]};
const $=id=>document.getElementById(id);
let L=localStorage.getItem('kd_l')||'bn',th=localStorage.getItem('kd_t')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),DATA=null,ART={},tab=0;
const i=()=>L=='bn'?0:1,bn=n=>L=='bn'?String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]):n;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=(a,k)=>(L=='en'&&a[k+'_en'])||a[k]||'';
const cn=k=>{const c=CATS.find(c=>c[0]==k);return c?c[i()+1]:''};
const loc=()=>L=='bn'?'bn-BD':'en-GB';
const ago=a=>{const m=Math.max(1,Math.floor((Date.now()-new Date(a.date))/6e4));let n,u;if(m<60){n=m;u=['মিনিট','min']}else if(m<1440){n=Math.floor(m/60);u=['ঘণ্টা','hr']}else{n=Math.floor(m/1440);u=['দিন','day']}return L=='bn'?bn(n)+' '+u[0]+' আগে':n+' '+u[1]+(n>1&&u[1]!='min'?'s':'')+' ago'};
const dl=a=>a.deadline?new Date(a.deadline+'T23:59:59'):null;
const dfmt=a=>dl(a).toLocaleDateString(loc(),{day:'numeric',month:'long',year:'numeric'});
const left=a=>{const n=Math.ceil((dl(a)-Date.now())/864e5);return n<0?S.exp[i()]:(L=='bn'?bn(n)+' দিন বাকি':n+' day'+(n>1?'s':'')+' left')};
const jb=a=>a.cat=='jobs'&&(a.company||a.company_en||a.deadline)?`<div class="job">${a.company||a.company_en?`<span>🏢 ${esc(t(a,'company'))}</span>`:''}${a.deadline?`<span>⏳ ${dfmt(a)}</span>`:''}</div>`:'';
const jbox=a=>{if(a.cat!='jobs'||!(a.company||a.company_en||a.deadline||a.apply_url))return'';const ok=/^https?:\/\//.test(a.apply_url||'');return `<div class="jbox">${a.company||a.company_en?`<div><b>${S.org[i()]}:</b> ${esc(t(a,'company'))}</div>`:''}${a.deadline?`<div><b>${S.dead[i()]}:</b> ${dfmt(a)} <span class="chip">${left(a)}</span></div>`:''}${ok?`<a class="apply" target="_blank" rel="noopener" href="${esc(a.apply_url)}">${S.apply[i()]} →</a>`:''}</div>`};
const pic=a=>`<div class="img ${a.image?'':'noimg'}">${a.image?`<img src="${esc(a.image)}" loading="lazy" alt="">`:''}</div>`;
const chip=a=>`<span class="chip">${cn(a.cat)}</span>`;
const card=(a,n)=>`<a class="card" style="animation-delay:${n*60}ms" href="#/a/${a.id}">${pic(a)}<div class="b">${chip(a)}<h3>${esc(t(a,'title'))}</h3><p>${esc(t(a,'desc'))}</p>${jb(a)}<span class="meta">🕒 ${ago(a)}</span></div></a>`;
const mini=a=>`<a class="mini" href="#/a/${a.id}">${pic(a)}<div><h4>${esc(t(a,'title'))}</h4><span class="meta">${cn(a.cat)} · ${ago(a)}</span></div></a>`;
const sec=(c,more)=>`<div class="sec"><h2>${c}</h2>${more?`<a href="#/c/${more}">${S.all[i()]}</a>`:''}</div>`;
function side(){
  $('t0').textContent=S.t0[i()];$('t1').textContent=S.t1[i()];$('t0').className=tab?'':'on';$('t1').className=tab?'on':'';
  const l=tab?[...DATA].sort((a,b)=>(b.views||0)-(a.views||0)):DATA;
  $('side').innerHTML=l.slice(0,7).map((a,n)=>`<a class="li" href="#/a/${a.id}">${tab?`<span class="n">${bn(n+1)}</span>`:''}<span>${esc(t(a,'title'))}<small>${cn(a.cat)} · ${ago(a)}</small></span></a>`).join('')||`<div class="li">${S.none[i()]}</div>`}
async function route(){
  document.documentElement.dataset.theme=th;document.documentElement.lang=L;
  $('lg').textContent=L=='bn'?'English':'বাংলা';$('th').textContent=th=='dark'?'☀️ '+(i()?'Light':'লাইট'):'🌙 '+(i()?'Dark':'ডার্ক');
  $('date').textContent=new Date().toLocaleDateString(loc(),{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('tag').textContent=S.tag[i()];$('bk').textContent=S.bk[i()];$('cp').textContent=S.cp[i()];$('q').placeholder=S.ph[i()];
  $('fl').innerHTML=CATS.slice(1).map(c=>`<a href="#/c/${c[0]}">${c[i()+1]}</a>`).join('');
  const p=location.hash.slice(2).split('/'),isA=p[0]=='a',isS=p[0]=='s',cat=p[0]=='c'?p[1]:'home';
  $('nav').innerHTML=CATS.map(c=>`<a href="#/${c[0]=='home'?'':'c/'+c[0]}" class="${!isA&&!isS&&c[0]==cat?'on':''}">${c[i()+1]}</a>`).join('');
  if(!DATA){$('main').innerHTML='<div class="sk"></div><div class="sk"></div>';
    try{DATA=await(await fetch('/api/news')).json()}catch(e){DATA=[]}if(!Array.isArray(DATA))DATA=[];DATA.sort((a,b)=>b.date.localeCompare(a.date))}
  $('tk').textContent=DATA.slice(0,8).map(a=>t(a,'title')).join('   ●   ')||'';
  side();$('top').innerHTML='';let h='';
  if(isA){
    let a=ART[p[1]];if(!a){try{a=ART[p[1]]=await(await fetch('/api/news?id='+p[1])).json()}catch(e){}}
    if(!a||a.error)h=`<div class="empty">404</div>`;
    else{document.title=t(a,'title')+' | খবরদেখো';const u=encodeURIComponent(location.href),tt=encodeURIComponent(t(a,'title'));
      const rel=DATA.filter(x=>x.cat==a.cat&&x.id!=a.id).slice(0,3);
      h=`<article class="art"><a href="#/" class="back">${S.back[i()]}</a><div style="margin-top:12px">${chip(a)} <span class="meta">${new Date(a.date).toLocaleDateString(loc(),{day:'numeric',month:'long',year:'numeric'})} · ${ago(a)} · 👁 ${bn(a.views||0)}</span></div><h1>${esc(t(a,'title'))}</h1>${t(a,'desc')?`<p class="lede">${esc(t(a,'desc'))}</p>`:''}${a.image?`<div class="img"><img src="${esc(a.image)}" alt=""></div>`:''}${jbox(a)}<div class="body">${esc(t(a,'content')).split(/\n\s*\n/).filter(x=>x.trim()).map(x=>`<p>${x.replace(/\n/g,'<br>')}</p>`).join('')}</div>
      <div class="share"><b>${S.share[i()]}</b><a target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=${u}">Facebook</a><a target="_blank" rel="noopener" href="https://wa.me/?text=${tt}%20${u}">WhatsApp</a><button id="cpy">${S.copy[i()]}</button></div></article>${rel.length?sec(S.rel[i()])+`<div class="cards">${rel.map(card).join('')}</div>`:''}`}
  }else if(isS){
    const q=decodeURIComponent(p[1]||'').toLowerCase(),r=DATA.filter(a=>[a.title,a.title_en,a.desc,a.desc_en].join(' ').toLowerCase().includes(q));
    h=sec(S.sr[i()]+esc(q))+(r.length?`<div class="cards">${r.map(card).join('')}</div>`:`<div class="empty">${S.none[i()]}</div>`)
  }else if(cat=='home'){
    if(!DATA.length)h=`<div class="empty">${S.none[i()]}</div>`;
    else{const lead=DATA.find(a=>a.featured)||DATA[0],others=DATA.filter(a=>a!=lead),ms=others.slice(0,4),used=new Set([lead,...ms]);
      $('top').innerHTML=`<div class="hero"><a class="hl" href="#/a/${lead.id}">${pic(lead)}<div class="cap">${chip(lead)}<h1>${esc(t(lead,'title'))}</h1><p>${esc(t(lead,'desc'))}</p></div></a><div class="minis">${ms.map(mini).join('')}</div></div>`;
      CATS.slice(1).forEach(c=>{const l=DATA.filter(a=>a.cat==c[0]&&!used.has(a));if(l.length)h+=sec(c[i()+1],c[0])+`<div class="cards">${l.slice(0,4).map(card).join('')}</div>`});
      if(!h)h=`<div class="cards">${others.slice(4).map(card).join('')}</div>`}
  }else{
    const l=DATA.filter(a=>a.cat==cat);h=sec(cn(cat))+(l.length?`<div class="cards">${l.map(card).join('')}</div>`:`<div class="empty">${S.none[i()]}</div>`)}
  $('main').innerHTML=h;const c=$('cpy');if(c)c.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(location.href);c.textContent=S.copied[i()]};
}
