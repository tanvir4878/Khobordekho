<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Khobordekho | খবরদেখো</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Merriweather:wght@900&display=swap" rel="stylesheet">
<style>
:root{--red:#8b0000;--red2:#a50f15;--bg:#f4f4f4;--card:#fff;--text:#1a1a1a;--mut:#666;--line:#e3e3e3}
:root[data-theme=dark]{--red:#b3121b;--red2:#d12029;--bg:#121212;--card:#1c1c1c;--text:#f0f0f0;--mut:#9a9a9a;--line:#2e2e2e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans Bengali',system-ui,sans-serif;line-height:1.6}
a{color:inherit;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:0 14px}
.top{background:var(--red);color:#fff;font-size:13px}.top .wrap{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;flex-wrap:wrap;gap:6px}
.btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);padding:3px 11px;border-radius:14px;cursor:pointer;font:inherit;font-size:12px;margin-left:6px}
.btn:hover{background:#fff;color:var(--red)}
.brand{background:var(--card);border-bottom:1px solid var(--line);text-align:center;padding:14px 0}
.logo{font-family:'Merriweather','Noto Sans Bengali',serif;font-weight:900;font-size:38px;color:var(--red2)}.logo span{color:var(--text)}
.tag{font-size:12px;color:var(--mut)}
nav{background:var(--card);border-bottom:3px solid var(--red);position:sticky;top:0;z-index:5}nav .wrap{display:flex;overflow-x:auto;scrollbar-width:none}
nav a{padding:11px 14px;font-weight:600;white-space:nowrap;font-size:15px}nav a:hover,nav a.on{background:var(--red);color:#fff}
.ticker{display:flex;align-items:center;background:var(--card);margin-top:10px;border:1px solid var(--line)}
.ticker b{background:var(--red2);color:#fff;padding:7px 14px;white-space:nowrap}.ticker div{overflow:hidden;white-space:nowrap;flex:1}
.ticker p{display:inline-block;margin:0;padding-left:100%;animation:mq 50s linear infinite;font-size:14px}@keyframes mq{to{transform:translateX(-100%)}}
.grid{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin:18px 0}
.sec{border-bottom:2px solid var(--red);margin:0 0 14px;display:flex}.sec h2{margin:0;background:var(--red);color:#fff;font-size:16px;padding:4px 14px}
.img{aspect-ratio:16/9;background:linear-gradient(135deg,var(--red),var(--red2));position:relative;overflow:hidden}
.img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.img i{position:absolute;left:8px;bottom:8px;font-style:normal;background:var(--red2);color:#fff;font-size:12px;padding:1px 9px;font-weight:600}
.lead{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-bottom:22px}
.big h1{font-size:26px;line-height:1.35;margin:10px 0 6px}.big p,.card p{color:var(--mut);margin:0 0 4px;font-size:15px}
.it{display:block;padding:9px 0;border-bottom:1px solid var(--line);font-weight:600}.it:hover,.card:hover h3,.box li:hover{color:var(--red2)}
.meta,.it small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);display:block;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.2)}
.card .b{padding:10px 12px 12px}.card h3{font-size:17px;line-height:1.4;margin:0 0 6px}
.box{background:var(--card);border:1px solid var(--line);padding:14px;margin-bottom:18px}
.box ol{margin:0;padding:0;list-style:none;counter-reset:n}.box li{counter-increment:n;padding:9px 0;border-bottom:1px solid var(--line);font-weight:600;font-size:15px}
.box li a{display:flex;gap:10px}.box li a:before{content:counter(n);color:#fff;background:var(--red);min-width:26px;height:26px;display:grid;place-items:center;border-radius:50%;font-size:13px}
.art h1{font-size:30px;line-height:1.35;margin:10px 0}.art .body p{font-size:18px;margin:0 0 16px}.art .img{aspect-ratio:16/9;margin:12px 0}
.empty{padding:40px;text-align:center;color:var(--mut);background:var(--card);border:1px dashed var(--line)}
footer{background:var(--red);color:#fff;margin-top:30px;padding:24px 0 14px;font-size:14px}
@media(max-width:820px){.grid,.lead{grid-template-columns:1fr}.logo{font-size:30px}}
</style></head><body>
<div class="top"><div class="wrap"><span id="date"></span><div><button class="btn" id="lg"></button><button class="btn" id="th"></button></div></div></div>
<div class="brand"><a href="#/"><div class="logo">খবর<span>দেখো</span></div></a><div class="tag" id="tag"></div></div>
<nav><div class="wrap" id="nav"></div></nav>
<div class="wrap"><div class="ticker"><b id="bk"></b><div><p id="tk"></p></div></div>
<div class="grid"><main id="main"></main><aside>
<div class="box"><div class="sec"><h2 id="mr"></h2></div><ol id="pop"></ol></div>
<div class="box"><div class="sec"><h2 id="lt"></h2></div><div id="side"></div></div></aside></div></div>
<footer><div class="wrap"><div class="logo" style="color:#fff;font-size:26px">খবরদেখো · Khobordekho</div><small id="cp"></small></div></footer>
<script>
const CATS=[["home","প্রচ্ছদ","Home"],["bd","বাংলাদেশ","Bangladesh"],["pol","রাজনীতি","Politics"],["world","আন্তর্জাতিক","International"],["eco","অর্থনীতি","Economy"],["sport","খেলা","Sports"],["ent","বিনোদন","Entertainment"],["tech","প্রযুক্তি","Technology"],["edu","শিক্ষা","Education"],["op","মতামত","Opinion"],["life","লাইফস্টাইল","Lifestyle"]];
const S={tag:["সত্য ও নিরপেক্ষ সংবাদের বিশ্বস্ত ঠিকানা","Your trusted source for truthful news"],bk:["শিরোনাম","BREAKING"],mr:["সর্বাধিক পঠিত","Most Read"],lt:["সর্বশেষ","Latest"],cp:["© খবরদেখো। সর্বস্বত্ব সংরক্ষিত।","© Khobordekho. All rights reserved."],none:["এই বিভাগে এখনো কোনো খবর নেই।","No news in this section yet."],back:["← ফিরে যান","← Back"]};
const $=id=>document.getElementById(id);
let L=localStorage.getItem('kd_l')||'bn',th=localStorage.getItem('kd_t')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),DATA=null,ART={};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t=(a,k)=>(L=='en'&&a[k+'_en'])||a[k]||'';
const cn=k=>{const c=CATS.find(c=>c[0]==k);return c?c[L=='bn'?1:2]:''};
const dt=a=>new Date(a.date).toLocaleDateString(L=='bn'?'bn-BD':'en-GB',{day:'numeric',month:'long',year:'numeric'});
const im=a=>`<div class="img">${a.image?`<img src="${esc(a.image)}" loading="lazy" alt="">`:''}<i>${cn(a.cat)}</i></div>`;
const card=a=>`<a class="card" href="#/a/${a.id}">${im(a)}<div class="b"><h3>${esc(t(a,'title'))}</h3><p>${esc(t(a,'desc'))}</p><span class="meta">${dt(a)}</span></div></a>`;
async function route(){
  document.documentElement.dataset.theme=th;document.documentElement.lang=L;
  const i=L=='bn'?0:1;
  $('lg').textContent=L=='bn'?'English':'বাংলা';$('th').textContent=th=='dark'?(i?'☀️ Light':'☀️ লাইট'):(i?'🌙 Dark':'🌙 ডার্ক');
  $('date').textContent=new Date().toLocaleDateString(L=='bn'?'bn-BD':'en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  $('tag').textContent=S.tag[i];$('bk').textContent=S.bk[i];$('mr').textContent=S.mr[i];$('lt').textContent=S.lt[i];$('cp').textContent=S.cp[i];
  if(!DATA){try{DATA=await(await fetch('/api/news')).json()}catch(e){DATA=[]}if(!Array.isArray(DATA))DATA=[];DATA.sort((a,b)=>b.date.localeCompare(a.date))}
  const p=location.hash.slice(2).split('/'),isA=p[0]=='a',cat=p[0]=='c'?p[1]:'home';
  $('nav').innerHTML=CATS.map(c=>`<a href="#/${c[0]=='home'?'':'c/'+c[0]}" class="${!isA&&c[0]==cat?'on':''}">${c[i+1]}</a>`).join('');
  $('tk').textContent=DATA.slice(0,6).map(a=>t(a,'title')).join('   ●   ');
  const mini=a=>`<a class="it" href="#/a/${a.id}">${esc(t(a,'title'))}<small>${cn(a.cat)} · ${dt(a)}</small></a>`;
  $('side').innerHTML=DATA.slice(0,6).map(mini).join('');
  $('pop').innerHTML=[...DATA].sort((a,b)=>(b.views||0)-(a.views||0)).slice(0,6).map(a=>`<li><a href="#/a/${a.id}">${esc(t(a,'title'))}</a></li>`).join('');
  let h='';
  if(isA){
    let a=ART[p[1]];if(!a){try{a=ART[p[1]]=await(await fetch('/api/news?id='+p[1])).json()}catch(e){}}
    if(!a||a.error){h=`<div class="empty">404</div>`}
    else{document.title=t(a,'title')+' | Khobordekho';
      h=`<article class="art"><a href="#/" class="meta">${S.back[i]}</a><div class="meta" style="margin-top:8px">${cn(a.cat)} · ${dt(a)}</div><h1>${esc(t(a,'title'))}</h1>${a.image?`<div class="img"><img src="${esc(a.image)}" alt=""></div>`:''}<div class="body">${esc(t(a,'content')||t(a,'desc')).split(/\n\s*\n/).map(x=>`<p>${x.replace(/\n/g,'<br>')}</p>`).join('')}</div></article>`}
  }else{
    const list=cat=='home'?DATA:DATA.filter(a=>a.cat==cat);
    if(!list.length)h=`<div class="empty">${S.none[i]}</div>`;
    else{let rest=list;
      if(cat=='home'){const a=list.find(x=>x.featured)||list[0];rest=list.filter(x=>x!=a);
        h+=`<div class="lead"><a class="big" href="#/a/${a.id}">${im(a)}<h1>${esc(t(a,'title'))}</h1><p>${esc(t(a,'desc'))}</p></a><div>${rest.slice(0,5).map(mini).join('')}</div></div>`;rest=rest.slice(5)}
      if(rest.length)h+=`<div class="sec"><h2>${cn(cat)}</h2></div><div class="cards">${rest.map(card).join('')}</div>`;
      else if(cat!='home')h+=`<div class="cards">${list.map(card).join('')}</div>`}
  }
  $('main').innerHTML=h;
}
$('lg').onclick=()=>{L=L=='bn'?'en':'bn';localStorage.setItem('kd_l',L);route()};
$('th').onclick=()=>{th=th=='dark'?'light':'dark';localStorage.setItem('kd_t',th);route()};
addEventListener('hashchange',()=>{route();scrollTo(0,0)});route();
</script></body></html>
